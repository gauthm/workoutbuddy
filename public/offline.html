<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkoutBuddy — Offline</title>
  <style>
    body {
      background: #1a1a1a; color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh; margin: 0; text-align: center; padding: 2rem;
    }
    h1 { font-size: 3rem; margin-bottom: 1rem; }
    p  { color: #888; max-width: 300px; line-height: 1.6; }
    button {
      margin-top: 1.5rem; padding: 0.75rem 1.5rem;
      background: #e67e22; color: #fff; border: none;
      border-radius: 10px; font-size: 1rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🏋️</h1>
  <h2>WorkoutBuddy</h2>
  <p id="offline-message">You are offline. Reconnect to the local network to continue.</p>
  <button id="offline-retry">Retry</button>
  <script src="/js/offline.js" defer></script>
</body>
</html>
